name: Wydanie

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Celowo starszy runner: binarka wymaga glibc w wersji z systemu,
          # na ktorym powstala. ubuntu-latest (24.04) dawal GLIBC_2.39, przez co
          # plik nie startowal na Ubuntu 22.04, Debianie 12, Mincie 21 ani Fedorze 39.
          # 22.04 to glibc 2.35 — pokrywa wszystko od 2022 roku wzwyz.
          - os: ubuntu-22.04
            nazwa: ChmurkowyLauncher
            artefakt: ChmurkowyLauncher-linux-x64
          - os: windows-latest
            nazwa: ChmurkowyLauncher.exe
            artefakt: ChmurkowyLauncher-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pelna historia i tagi — opis wydania bierzemy z tresci tagu,
          # a Linux publikuje je juz z tego zadania.
          fetch-depth: 0

      # eframe na Linuksie linkuje sie z bibliotekami okien i dzwieku.
      - name: Zależności systemowe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Testy
        run: cargo test --workspace

      - name: Budowanie
        env:
          # Ustaw w repozytorium: Settings → Secrets and variables → Actions → Variables
          CHMURKA_MANIFEST_URL: ${{ vars.CHMURKA_MANIFEST_URL }}
        run: cargo build --release -p chmurkowy-launcher

      # Wersja glibc decyduje o tym, na ilu dystrybucjach binarka w ogole ruszy.
      # Bez tej kontroli podbicie runnera cicho odcieloby starsze systemy.
      - name: Kontrola zgodnosci glibc (Linux)
        if: runner.os == 'Linux'
        run: |
          MAX=$(objdump -T target/release/ChmurkowyLauncher \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "Najwyzsza wymagana wersja: $MAX"
          if [ "$(printf '%s\nGLIBC_2.35\n' "$MAX" | sort -uV | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::Binarka wymaga $MAX, a limit to GLIBC_2.35 — nie ruszy na Ubuntu 22.04, Debianie 12 ani Mincie 21."
            exit 1
          fi

      - name: Zmiana nazwy
        shell: bash
        run: cp "target/release/${{ matrix.nazwa }}" "${{ matrix.artefakt }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefakt }}
          path: ${{ matrix.artefakt }}

      # --- Wydanie rusza od razu po Linuksie ---
      #
      # Linux kompiluje sie w ~6 minut, Windows w ~11. Czekanie na oba trzymalo
      # gotowa binarke w szufladzie przez te dodatkowe minuty, choc nikomu nie
      # byla do niczego potrzebna. Publikujemy wiec od razu, z adnotacja,
      # ze plik dla Windowsa jeszcze sie kompiluje — dokleja go zadanie ponizej.
      #
      # Opis wydania bierzemy z tresci adnotowanego tagu: changelog powstaje
      # razem z wersja i nie ma osobnego pliku, ktory mozna zapomniec. Bez
      # jawnego pobrania tagow adnotowanych git widzi tag jako lekki
      # i %(contents) zwraca tresc commita zamiast opisu wydania.
      - name: Treść wydania z opisu tagu (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --force --tags origin
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notatki.md
          cat >> notatki.md <<'STOPKA'

          ---
          ⏳ **Wersja na Windowsa jeszcze się kompiluje.** Pojawi się tutaj za
          kilka minut — odśwież wtedy tę stronę.
          STOPKA
          echo "--- treść wydania ---"
          cat notatki.md

      - name: Wydanie z binarką Linuksa
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: notatki.md
          files: ${{ matrix.artefakt }}

  # Windows dolacza do gotowego juz wydania i zdejmuje adnotacje o czekaniu.
  dolacz-windowsa:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ChmurkowyLauncher-windows-x64.exe

      - name: Treść wydania z opisu tagu
        run: |
          git fetch --force --tags origin
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notatki.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notatki.md
          files: ChmurkowyLauncher-windows-x64.exe

  # Gdy Windows nie wyszedl, a Linux zdazyl juz opublikowac wydanie, w opisie
  # zostalaby obietnica pliku, ktory nigdy nie przyjdzie. Prostujemy ja sami,
  # zeby nikt nie odswiezal strony w nieskonczonosc.
  sprostuj-windowsa:
    needs: build
    runs-on: ubuntu-latest
    if: failure() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sprostowanie w opisie wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Brak wydania znaczy, ze Linux tez nie wyszedl — nie ma czego prostowac.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Wydanie nie powstalo — nie ma czego prostowac."
            exit 0
          fi
          git fetch --force --tags origin
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notatki.md
          cat >> notatki.md <<'STOPKA'

          ---
          ⚠️ **Budowanie wersji na Windowsa nie powiodło się.** Na razie jest tu
          tylko plik dla Linuksa.
          STOPKA
          gh release edit "$GITHUB_REF_NAME" --notes-file notatki.md
