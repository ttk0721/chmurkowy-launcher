[package]
name = "chmurka-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chmurka-core = { version = "0.1.0", path = "../core" }
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "http2", "charset"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "chmurka"
path = "src/main.rs"
