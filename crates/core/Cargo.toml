[package]
name = "chmurka-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
flate2 = "1.1.10"
futures-util = "0.3.34"
lzma-rs = "0.3.0"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "form", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync", "io-util"] }
zip = "8.6.0"

# Blokada pliku, ktora pilnuje jednego egzemplarza launchera. Na Windowsie
# wystarcza std (`share_mode(0)`), na Uniksie potrzebny jest `flock`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
# `test-util` daje zegar, ktory da sie przewinac. Bez niego test limitu czasu
# dla komendy gracza musialby naprawde czekac dwie minuty.
tokio = { version = "1.53.1", features = ["test-util"] }
