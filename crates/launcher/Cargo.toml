[package]
name = "chmurkowy-launcher"
version = "0.4.18"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
chmurka-core = { version = "0.1.0", path = "../core" }
eframe = "0.32.3"
egui = "0.32.3"
open = "5.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "http2", "charset"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

# Zasobnik systemowy. Celowo rozne biblioteki na kazdy system:
# tray-icon na Linuksie ciagnalby GTK i libxdo, a ksni gada wprost po D-Bus
# i nie dokłada ani jednej zaleznosci C do binarki.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.24"

[[bin]]
name = "ChmurkowyLauncher"
path = "src/main.rs"
